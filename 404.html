<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden – Hüseyin Tasal</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f1e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15120e" media="(prefers-color-scheme: dark)">
  <!-- absolute Pfade, damit die Seite auch in Unterordnern korrekt aussieht -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script>try{var t=localStorage.getItem("ht-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
  <main class="notfound" id="main">
    <div class="wrap">
      <img class="big logo-light" src="/assets/logo/ht-logo-icon-farbig.svg" alt="" width="96" height="96" style="width:96px;height:96px;margin:0 auto 24px"><img class="big logo-dark" src="/assets/logo/ht-logo-icon-fuer-dunklen-hintergrund.svg" alt="" width="96" height="96" style="width:96px;height:96px;margin:0 auto 24px">
      <p class="code">FEHLER 404</p>
      <h1>Diese Seite gibt es nicht.</h1>
      <p>Der Link ist veraltet oder enthält einen Tippfehler. / This page does not exist.</p>
      <a class="btn btn-primary" href="/">Zur Startseite</a>
    </div>
  </main>
</body>
</html>
